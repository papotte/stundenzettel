name: E2E Tests

on:
  workflow_call:

jobs:
  e2e-tests:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium] #, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Firebase emulators
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase.json', 'package-lock.json') }}
          restore-keys: firebase-emulators-

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key: playwright-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}
          restore-keys: |
            playwright-${{ matrix.browser }}-
            playwright-

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Verify Playwright browsers
        run: npx playwright install --dry-run ${{ matrix.browser }}

      - name: Create .env.test file
        run: |
          cat > .env.test << 'EOF'
          # Test environment variables for E2E tests
          NODE_ENV=test
          NEXT_PUBLIC_ENVIRONMENT=test

          # Firebase (emulator-only; demo-* skips production API calls in the CLI)
          NEXT_PUBLIC_FIREBASE_API_KEY=dummy-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=demo-e2e.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=demo-e2e
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=demo-e2e.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=123456789
          NEXT_PUBLIC_FIREBASE_APP_ID=test-app-id
          NEXT_PUBLIC_FIREBASE_DATABASE_ID=test-database

          # Stripe (Test config - using real secrets)
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}

          # Other secrets
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          EOF

      - name: Run E2E tests (${{ matrix.browser }})
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.browser }}
          # Match .env.test so the CLI does not call production for the real project ID
          GCLOUD_PROJECT: demo-e2e
          # Align Node date math with Playwright `timezoneId` (playwright.config.ts)
          TZ: UTC
        run: npm run test:e2e:ci

      - name: Save Playwright browsers cache
        if: always() && steps.cache-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key: playwright-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}
